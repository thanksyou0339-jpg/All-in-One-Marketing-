<!-- =========================================
     MARKETING LINKS
========================================= -->

<section
    id="marketingLinksSection"
    style="
        margin-top:30px;
        padding:20px;
        background:#ffffff;
        border-radius:18px;
        box-shadow:0 8px 25px rgba(0,0,0,.08);
    "
>

    <h2 style="margin-top:0;">
        📣 Marketing Links
    </h2>

    <p style="color:#666;">
        Food, Shopping اور دوسرے Affiliate Links یہاں manage کریں۔
    </p>


    <!-- ADD / EDIT MARKETING LINK -->

    <div
        style="
            display:grid;
            gap:12px;
            margin-top:18px;
        "
    >

        <input
            id="marketingDocId"
            type="hidden"
        >


        <input
            id="marketingCompany"
            type="text"
            placeholder="Company / Platform (مثلاً Foodpanda)"
            style="padding:12px;border-radius:10px;border:1px solid #ddd;"
        >


        <select
            id="marketingCategory"
            style="padding:12px;border-radius:10px;border:1px solid #ddd;"
        >

            <option value="Food">🍔 Food</option>

            <option value="Motorcycle">🏍️ Motorcycle</option>

            <option value="Cars & Spare Parts">
                🚗 Cars & Spare Parts
            </option>

            <option value="General Products">
                🛍️ General Products
            </option>

            <option value="Shopping">
                🛒 Shopping
            </option>

            <option value="Other">
                🏷️ Other
            </option>

        </select>


        <input
            id="marketingSlug"
            type="text"
            placeholder="Short Name (مثلاً food)"
            style="padding:12px;border-radius:10px;border:1px solid #ddd;"
        >


        <input
            id="marketingAffiliateLink"
            type="url"
            placeholder="Original Affiliate Link"
            style="padding:12px;border-radius:10px;border:1px solid #ddd;"
        >


        <select
            id="marketingStatus"
            style="padding:12px;border-radius:10px;border:1px solid #ddd;"
        >

            <option value="true">
                Active
            </option>

            <option value="false">
                Inactive
            </option>

        </select>


        <div
            style="
                display:flex;
                gap:10px;
                flex-wrap:wrap;
            "
        >

            <button
                id="saveMarketingBtn"
                type="button"
            >
                SAVE MARKETING LINK
            </button>


            <button
                id="newMarketingBtn"
                type="button"
            >
                NEW
            </button>

        </div>


        <div
            id="marketingGeneratedLink"
            style="
                padding:12px;
                background:#f5f5f5;
                border-radius:10px;
                word-break:break-all;
                display:none;
            "
        ></div>

    </div>


    <!-- MARKETING TABLE -->

    <div
        style="
            overflow-x:auto;
            margin-top:25px;
        "
    >

        <table
            style="
                width:100%;
                border-collapse:collapse;
                min-width:700px;
            "
        >

            <thead>

                <tr>

                    <th>Platform</th>

                    <th>Category</th>

                    <th>Short Link</th>

                    <th>Clicks</th>

                    <th>Status</th>

                    <th>Actions</th>

                </tr>

            </thead>


            <tbody
                id="marketingLinksTable"
            >

                <tr>

                    <td colspan="6">
                        Marketing links loading...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</section>
